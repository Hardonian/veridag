[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
git-fetch-with-cli = true

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path-only internal dev-dependencies are intentionally omitted from published
# crates, preventing circular/unpublished dev edges from blocking workspace
# publication. Wildcards remain denied for normal and build dependencies.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
