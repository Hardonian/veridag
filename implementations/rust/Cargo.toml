[workspace]
members = ["crates/*", "bins/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
