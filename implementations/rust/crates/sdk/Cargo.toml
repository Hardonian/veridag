[package]
name = "veridag-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
veridag-codec = { version = "1.0.0", path = "../codec" }
veridag-crypto = { version = "1.0.0", path = "../crypto" }
veridag-protocol-types = { version = "1.0.0", path = "../protocol-types" }
veridag-transaction = { version = "1.0.0", path = "../transaction" }
veridag-object-state = { version = "1.0.0", path = "../object-state" }
veridag-checkpoint = { version = "1.0.0", path = "../checkpoint" }
veridag-stablecoin = { version = "1.0.0", path = "../stablecoin" }
thiserror = { workspace = true }

[features]
default = []
# Enables an HTTP client implementation (requires a network transport).
http = ["dep:reqwest"]

[dependencies.reqwest]
version = "0.12"
optional = true
default-features = false
features = ["json", "rustls-tls"]

[dev-dependencies]
hex.workspace = true
serde_json.workspace = true
