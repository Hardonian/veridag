[package]
name = "veridag-qa"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
veridag-codec = { version = "1.0.0", path = "../codec" }
veridag-crypto = { version = "1.0.0", path = "../crypto" }
veridag-protocol-types = { version = "1.0.0", path = "../protocol-types" }
veridag-transaction = { version = "1.0.0", path = "../transaction" }
veridag-merkle = { version = "1.0.0", path = "../merkle" }
veridag-object-state = { version = "1.0.0", path = "../object-state" }
veridag-dag = { version = "1.0.0", path = "../dag" }
veridag-consensus = { version = "1.0.0", path = "../consensus" }
veridag-execution = { version = "1.0.0", path = "../execution" }
veridag-storage = { version = "1.0.0", path = "../storage", features = ["persistent"] }
veridag-checkpoint = { version = "1.0.0", path = "../checkpoint" }
proptest = "1"
hex = "0.4"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "hotpath"
harness = false

[features]
default = []
