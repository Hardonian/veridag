# Veridag workspace (root is a virtual manifest; the Rust implementation lives
# in implementations/rust). This file exists so repo-root tooling has a single
# entry point. The working build manifest is implementations/rust/Cargo.toml.

[workspace]
members = ["implementations/rust/crates/*", "implementations/rust/bins/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
version = "0.1.0-alpha"
authors = ["Veridag Protocol Contributors"]
description = "Veridag: deterministic, Byzantine-resilient, capability-secured distributed execution substrate"
repository = "https://github.com/Hardonian/veridag"
homepage = "https://veridag.dev"
keywords = ["blockchain", "consensus", "dag", "bft", "distributed-systems"]
categories = ["cryptography", "concurrency", "network-programming"]

[workspace.dependencies]
blake3 = "1.5"
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
rand = "0.10"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
async-trait = "0.1"
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false }
futures = "0.3"
tracing = "0.1"
sled = "0.34"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

