name: Deploy to Vercel (veridag-site)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-veridag-site.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps + build static export
        working-directory: site
        run: |
          npm install
          npm run build
      - name: Deploy to Vercel (prebuilt)
        working-directory: site
        run: |
          npm i -g vercel
          vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN" --scope shardie-githubs-projects --name veridag-site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
