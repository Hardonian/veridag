name: security

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo deny
        run: |
          cargo install cargo-deny --locked || true
          cargo deny check
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked || true
          cargo audit
