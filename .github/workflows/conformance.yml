name: conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: conformance (golden + malformed)
        working-directory: implementations/rust
        run: cargo test -p veridag-testkit --all-features
